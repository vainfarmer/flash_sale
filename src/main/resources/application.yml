server:
  port: 8080

spring:
  application:
    name: flash-sale
  devtools:
    restart:
      enabled: false

  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/flash_sale?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: Zzl20020929
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 10
      maximum-pool-size: 50
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 100
          max-wait: -1
          max-idle: 20
          min-idle: 10

  # Kafka配置
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 确认机制
      acks: all
      # 重试次数
      retries: 3
      # 批量大小
      batch-size: 16384
      # 缓冲区大小
      buffer-memory: 33554432
    consumer:
      group-id: flash-sale-order-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: flash-sale-secret-key-must-be-at-least-256-bits-long-for-security
  # Token有效期：24小时
  expiration: 86400000

# 订单超时配置
order:
  timeout:
    # 订单超时时间（分钟），默认30分钟
    minutes: 30
    # 是否启用订单超时自动取消
    enabled: true

# 日志配置
logging:
  level:
    org.example.flash_sale: DEBUG
    org.springframework.kafka: WARN

