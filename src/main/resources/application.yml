server:
  port: 8080
  tomcat:
    # 启用虚拟线程（Java 21+）
    threads:
      max: 400              # 最大工作线程数
      min-spare: 50         # 最小空闲线程数
    max-connections: 20000  # 最大连接数
    accept-count: 2000      # 等待队列长度
    connection-timeout: 3000 # 连接超时（毫秒）

spring:
  application:
    name: flash-sale
  devtools:
    restart:
      enabled: false
  # 启用虚拟线程（Java 21+）
  threads:
    virtual:
      enabled: true

  # 数据源配置（优化后）
  datasource:
    url: jdbc:mysql://localhost:3306/flash_sale?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=500&prepStmtCacheSqlLimit=2048
    username: root
    password: Zzl20020929
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: FlashSale-HikariCP
      minimum-idle: 20           # 最小空闲连接（提高）
      maximum-pool-size: 100     # 最大连接数（提高到CPU核数*12~15）
      idle-timeout: 30000        # 空闲超时
      max-lifetime: 1800000      # 最大生命周期
      connection-timeout: 3000   # 获取连接超时（缩短）
      validation-timeout: 2000   # 验证超时
      leak-detection-threshold: 60000  # 连接泄漏检测

  # Redis配置（优化后）
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000              # 命令超时
      connect-timeout: 2000      # 连接超时
      lettuce:
        pool:
          max-active: 500        # 最大活跃连接（大幅提高）
          max-wait: 2000ms       # 获取连接最大等待时间
          max-idle: 100          # 最大空闲连接
          min-idle: 50           # 最小空闲连接
          time-between-eviction-runs: 30s  # 空闲连接检测间隔

  # Kafka配置
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # 确认机制
      acks: all
      # 重试次数
      retries: 3
      # 批量大小
      batch-size: 16384
      # 缓冲区大小
      buffer-memory: 33554432
    consumer:
      group-id: flash-sale-order-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: flash-sale-secret-key-must-be-at-least-256-bits-long-for-security
  # Token有效期：24小时
  expiration: 86400000

# 订单超时配置
order:
  timeout:
    # 订单超时时间（分钟），默认30分钟
    minutes: 30
    # 是否启用订单超时自动取消
    enabled: true

# 日志配置
logging:
  level:
    org.example.flash_sale: DEBUG
    org.springframework.kafka: WARN

